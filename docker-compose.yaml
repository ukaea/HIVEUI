services:
  hiveui:
    image: hive-ui:dev
    pull_policy: never
    env_file: .env
    working_dir: /app
    ports:
      - "3003:3003"
    volumes:
      - ./example_data:/app/example_data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hive
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hive"]
      interval: 5s
      timeout: 5s
      retries: 10
